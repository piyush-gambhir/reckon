[package]
name = "reckon"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "One workspace for running several businesses with a coding agent"
license = "MIT"
repository = "https://github.com/piyush-gambhir/reckon"
include = ["/src/**", "/scripts/providers.json", "/scripts/cli-releases.csv", "/skills/reckon/**", "/WORKSPACE.md", "/examples/services.json", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/tests/native.rs", "/tests/fixtures/**"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["string"] }
ctrlc = { version = "3", features = ["termination"] }
glob = "0.3"
include_dir = "0.7"
idna = "1"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
url = "2"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
unwrap_used = "warn"
