name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate shell scripts
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0 -n 1 bash -n

      - name: Test CLI installer
        run: bash tests/test-cli-install.sh

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
          }
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level=high

      - name: Check web types
        working-directory: web
        run: pnpm types:check

      - name: Build web site
        working-directory: web
        run: pnpm build:cloudflare

      - name: Verify exported search index
        working-directory: web
        run: pnpm test:search
