name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate shell scripts
        run: |
          bash -n .envrc scripts/reckon
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -n 1 bash -n

      - name: Lint shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck --severity=error --shell=bash .envrc
          shellcheck --severity=error scripts/reckon
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error

      - name: Test reckon control surface
        run: |
          bash tests/test-reckon.sh
          bash tests/test-cli-install.sh
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
          }
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }

      - name: Smoke-test PowerShell control surface
        shell: pwsh
        run: |
          .\scripts\reckon.ps1 help
          try {
            .\scripts\reckon.ps1 status
            throw 'status unexpectedly succeeded without an environment'
          } catch {
            if ($_.Exception.Message -eq 'status unexpectedly succeeded without an environment') {
              throw
            }
          }
          .\scripts\reckon.ps1 use staging
          .\scripts\reckon.ps1 preflight
          if ($env:RECKON_ENV) { throw 'reckon.ps1 left RECKON_ENV set in the calling shell' }
          $env:reckon_env = 'lowercase'
          .\scripts\reckon.ps1 preflight
          if ($env:RECKON_ENV) { throw 'reckon.ps1 left RECKON_ENV set beside a lowercase reckon_env' }
          Remove-Item Env:reckon_env
          . .\scripts\activate.ps1
          $env:RECKON_ENV = 'uat'
          . .\scripts\activate.ps1
          if ($env:RECKON_ENV -cne 'uat') { throw 'activation discarded a RECKON_ENV set in the shell' }
          . .\scripts\activate.ps1
          if ($env:RECKON_ENV -cne 'uat') { throw 're-activation dropped the RECKON_ENV set in the shell' }
          . .\scripts\activate.ps1 -Env staging
          . .\scripts\activate.ps1
          if ($env:RECKON_ENV -cne 'staging') { throw 're-activation undid an explicit -Env selection' }

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level=high

      - name: Check peer dependencies
        working-directory: web
        run: pnpm peers check

      - name: Check web types
        working-directory: web
        run: pnpm types:check

      - name: Build web site
        working-directory: web
        run: pnpm build:cloudflare

      - name: Verify exported search index
        working-directory: web
        run: pnpm test:search
