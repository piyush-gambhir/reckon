name: CI

on:
  push:
    branches: [main]
  # Every pull request, including stacked ones whose base is another feature branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate shell scripts
        run: |
          bash -n scripts/reckon
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -n 1 bash -n

      - name: Lint shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck --severity=error scripts/reckon
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error

      - name: Test reckon control surface
        run: |
          bash tests/test-cli-install.sh
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
          }
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }

      - name: Smoke-test PowerShell control surface
        shell: pwsh
        run: |
          $env:RECKON_HOME = Join-Path ([System.IO.Path]::GetTempPath()) ('reckon-ci-' + [guid]::NewGuid())
          .\scripts\reckon.ps1 --help
          if ($LASTEXITCODE -ne 0) { throw 'help failed' }
          .\scripts\reckon.ps1 status
          if ($LASTEXITCODE -eq 0) { throw 'status unexpectedly succeeded without an org' }
          .\scripts\reckon.ps1 org add acme --envs 'prod,uat'
          if ($LASTEXITCODE -ne 0) { throw 'org add failed' }
          .\scripts\reckon.ps1 connect jenkins-uat --org acme --provider jenkins --for-env uat
          if ($LASTEXITCODE -ne 0) { throw 'connect failed' }
          .\scripts\reckon.ps1 use acme/uat
          .\scripts\reckon.ps1 preflight
          if ($LASTEXITCODE -ne 0) { throw 'preflight failed' }
          if ($env:RECKON_ORG) { throw 'reckon.ps1 left RECKON_ORG set in the calling shell' }

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level=high

      - name: Check peer dependencies
        working-directory: web
        run: pnpm peers check

      - name: Check web types
        working-directory: web
        run: pnpm types:check

      - name: Build web site
        working-directory: web
        run: pnpm build:cloudflare

      - name: Verify exported search index
        working-directory: web
        run: pnpm test:search
